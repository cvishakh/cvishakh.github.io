    <h2>Vision based interaction for AMR</h2>
    <p>Gesture recognition for enhanced human-robot collaboration in intralogistics applications, with seamless ROS2 integration.</p>

    <a class="source-link" href="https://github.com/cvishakh/gesture_classification_zed2i" target="_blank" rel="noopener noreferrer">

    <h3>Features</h3>
    <ul>
      <li>Engineered a production-grade custom gesture recognition system.</li>
      <li>Modular ROS2-based system architecture for gesture commands.</li>
      <li>Implemented algorithms for multi-object detection using the ZED 2i.</li>
      <li>Built a continuous integration pipeline and software stack in FAPS GitLab.</li>
      <li>Designed and documented the system architecture in Obsidian.</li>
      <li>Developed a behavior tree for modular and reusable gesture commands.</li>
    </ul>

      <span class="tag">Obsidian</span>
    </div>
  </template>

  <script src="./assets/js/site.js"></script>
  <script>
    (function () {
      var modal = null;
      var lastFocused = null;

      function closeModal() {
        if (!modal) return;
        modal.remove();
        modal = null;
        if (lastFocused) lastFocused.focus();
      }

      function openModal(key) {
        var tpl = document.getElementById('project-' + key);
        if (!tpl || modal) return;

        lastFocused = document.activeElement;

        modal = document.createElement('div');
        modal.className = 'modal';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');

        var content = document.createElement('div');
        content.className = 'modal__content';
        content.tabIndex = -1;

        var close = document.createElement('button');
        close.className = 'modal__close';
        close.type = 'button';
        close.setAttribute('aria-label', 'Close');
        close.innerHTML = '&times;';
        close.addEventListener('click', closeModal);

        content.appendChild(close);
        content.appendChild(tpl.content.cloneNode(true));
        modal.appendChild(content);
        document.body.appendChild(modal);
        content.focus();

        modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
      }

      document.querySelectorAll('.project-card').forEach(function (card) {
        card.addEventListener('click', function () { openModal(card.dataset.project); });
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
      });
    })();
  </script>
