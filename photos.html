<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery - Vishakh Cheruparambath</title>

  <meta name="description" content="Photo gallery of Vishakh Cheruparambath - snapshots from life, nature and work."/>
  <link rel="canonical" href="https://cvishakh.github.io/photos.html"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/site.css" />

  <script>
    /* applied before paint to avoid a flash of the wrong theme */
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', stored || 'dark');
    })();
  </script>
</head>

<body>
  <nav class="navbar" id="navbar">
    <div class="navbar__inner">
      <a class="nav-link" href="index.html">about</a>
      <a class="nav-link" href="timeline.html">profile</a>
      <a class="nav-link" href="projects.html">projects</a>
      <a class="nav-link" href="blogs.html">blog</a>
      <a class="nav-link is-active" href="photos.html">gallery</a>
      <button class="icon-btn" id="searchBtn" aria-label="Search (Ctrl+K)">
        <span class="kbd">ctrl k</span><i class="fas fa-magnifying-glass"></i>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
        <i class="fas fa-moon" id="themeIcon"></i>
      </button>
    </div>
  </nav>

  <main class="page page--wide">
    <h1 class="page-title">gallery</h1>
    <p class="page-subtitle">
      Snapshots from my journey. Select a photo to expand it, hover to see location.
    </p>

    <section class="gallery" id="gallery"></section>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" type="button" aria-label="Close">&times;</button>
    <img alt="Enlarged photo"/>
  </div>

  <footer>© 2026 Vishakh Cheruparambath. All rights reserved. Adapted from Jekyll with al-folio theme. Hosted by GitHub Pages.</footer>

  <script src="./assets/js/site.js"></script>
  <script>
    (function () {
      var gallery = document.getElementById('gallery');
      var lightbox = document.getElementById('lightbox');
      var lbImg = lightbox.querySelector('img');

      function closeLightbox() {
        lightbox.classList.remove('is-visible');
        lbImg.src = '';
      }

      lightbox.addEventListener('click', closeLightbox);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lightbox.classList.contains('is-visible')) closeLightbox();
      });

      fetch('photos_metadata.json')
        .then(function (res) { return res.json(); })
        .then(function (files) {
          files.forEach(function (entry) {
            var item = document.createElement('div');
            item.className = 'gallery__item';

            var img = document.createElement('img');
            img.src = 'photos/' + encodeURIComponent(entry.filename);
            img.alt = entry.location || entry.filename;
            img.loading = 'lazy';

            var meta = document.createElement('div');
            meta.className = 'gallery__meta';

            if (entry.latitude != null && entry.longitude != null) {
              var lat = entry.latitude.toFixed(2);
              var lon = entry.longitude.toFixed(2);
              var link = document.createElement('a');
              link.href = 'https://www.google.com/maps?q=' + lat + ',' + lon;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = '📍 ' + (entry.location || lat + '°, ' + lon + '°');
              link.addEventListener('click', function (e) { e.stopPropagation(); });
              meta.appendChild(link);
            } else {
              meta.textContent = '📍 No GPS data';
            }

            item.append(img, meta);
            item.addEventListener('click', function () {
              lbImg.src = img.src;
              lbImg.alt = img.alt;
              lightbox.classList.add('is-visible');
            });

            gallery.appendChild(item);
          });
        })
        .catch(function (err) {
          console.error('Failed to load photo metadata', err);
          var msg = document.createElement('p');
          msg.className = 'state-msg';
          msg.textContent = 'Could not load the gallery right now.';
          gallery.appendChild(msg);
        });
    })();
  </script>
</body>
</html>
